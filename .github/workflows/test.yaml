name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... && go vet ./... && test -z "$(gofmt -l .)"

  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned cluster tools
        run: bash .github/scripts/install-tools.sh
      - name: Check registry connectivity (up to three attempts)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 90s docker pull envoyproxy/gateway:v1.9.1; then
              exit 0
            fi
            echo "Registry preflight attempt $attempt failed"
            sleep 5
          done
          exit 1
      - name: Reproduce and verify client authentication
        id: probe
        env:
          RUN_EG: '1'
        shell: bash
        run: |
          set -o pipefail
          go test -v -count=1 -timeout=25m ./... 2>&1 | tee live-test.log
      - name: Verify no owned cluster resources remain
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            docker ps -a --format '{{.Names}}'
            docker network ls --format '{{.Name}}'
            docker volume ls --format '{{.Name}}'
          } > resource-names.txt
          if grep -E '(^|-)egtest-[0-9a-f]+' resource-names.txt; then
            echo 'Owned resources remain' | tee cleanup.txt
            exit 1
          fi
          echo 'No egtest containers, networks, or volumes remain' | tee cleanup.txt
      - name: Summarize expectations and results
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: python3 .github/scripts/summarize.py
      - name: Upload test and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-result
          path: |
            live-test.log
            cleanup.txt
            summary.md
          if-no-files-found: warn
